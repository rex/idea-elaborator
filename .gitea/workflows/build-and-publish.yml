name: Build and Publish idea-elaborator

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: git.thelab.host
  IMAGE_NAME: rex/idea-elaborator
  IMAGE_SOURCE_URL: https://git.thelab.host/rex/idea-elaborator
  REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
  REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: build_meta
        run: |
          set -euo pipefail
          python3 scripts/ci-version.py metadata > /tmp/build-meta.env
          cat /tmp/build-meta.env
          cat /tmp/build-meta.env >> "$GITHUB_OUTPUT"

      - name: Validate registry credentials
        run: |
          set -euo pipefail
          if [[ -z "${REGISTRY_USER}" || -z "${REGISTRY_TOKEN}" ]]; then
            echo "Missing REGISTRY_USER/REGISTRY_TOKEN in runner environment."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.build_meta.outputs.app_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.build_meta.outputs.app_git_sha_short }}
          labels: |
            org.opencontainers.image.title=Idea Elaborator
            org.opencontainers.image.description=Idea archive and elaboration API
            org.opencontainers.image.version=${{ steps.build_meta.outputs.app_version }}
            org.opencontainers.image.revision=${{ steps.build_meta.outputs.app_git_sha }}
            org.opencontainers.image.created=${{ steps.build_meta.outputs.app_build_date }}
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE_URL }}
          build-args: |
            APP_VERSION=${{ steps.build_meta.outputs.app_version }}
            APP_GIT_SHA=${{ steps.build_meta.outputs.app_git_sha }}
            APP_VERSION_FULL=${{ steps.build_meta.outputs.app_version }}-${{ steps.build_meta.outputs.app_git_sha_short }}
            APP_BUILD_DATE=${{ steps.build_meta.outputs.app_build_date }}
          provenance: false
          sbom: false
